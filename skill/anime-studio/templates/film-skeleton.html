<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FILM TITLE</title>
<style>
  :root { --bg:#000; --fg:#f2efe8; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family: Georgia, "Times New Roman", serif; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  /* 16:9 letterboxed; the canvas is always 1920x1080 internally */
  canvas { width:min(100vw, calc(100vh * 16 / 9)); height:auto; aspect-ratio:16/9; display:block; background:#000; }
  #sub { position:absolute; left:0; right:0; bottom:7%; text-align:center; pointer-events:none;
    font: 500 clamp(14px, 2.3vw, 30px)/1.3 "Helvetica Neue", Arial, sans-serif; color:#fff;
    text-shadow: 0 0 4px #000, 0 2px 3px #000; padding:0 8%; }
  .ui { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:rgba(0,0,0,.55); cursor:pointer; }
  .ui button { font:inherit; font-size:20px; padding:12px 28px; border-radius:999px; border:1px solid #fff8; background:#0008; color:#fff; cursor:pointer; }
  .ui .langs button { font-size:14px; padding:6px 14px; }
  .ui .langs button[aria-pressed="true"] { background:#fff; color:#000; }
  .hidden { display:none !important; }
  body.render #sub, body.render .ui { display:none !important; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="sub"></div>
<div class="ui" id="start">
  <button id="play">▶ Lecture / Play</button>
  <div class="langs"><button data-l="fr" aria-pressed="true">Sous-titres FR</button> <button data-l="en">EN subtitles</button> <button data-l="off">—</button></div>
</div>
<div class="ui hidden" id="end"><button id="replay">↺ Revoir / Replay</button></div>
<script>
'use strict';
/* ============================================================================
   FILM CONTRACT (see references/html-film-contract.md)
   - Every frame is a pure function of time: draw(t) reads nothing else.
   - window.FILM = { duration, ready, seek(t), audio(from,to) -> WAV ArrayBuffer, subtitles }
   - ?render=1 hides all UI, never autoplays, and lets the renderer call seek().
   ========================================================================== */
const W = 1920, H = 1080, FPS = 24;          // anime is timed at 24 fps
const DURATION = 10;                         // seconds — set to the real length
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
const cv = document.getElementById('c'), g = cv.getContext('2d');

// ---- seeded randomness: never call Math.random() inside draw ---------------
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
// hash a number pair to [0,1): stable per (shot, element, frame)
function hash(a, b = 0) { let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

// ---- hand-drawn timing helpers --------------------------------------------
// onTwos: hold every drawing for 2 frames (or 3) like cel animation
const stepT = (t, n = 2) => Math.floor(t * FPS / n) * n / FPS;
// boil: which of 3 redrawn line variants to show (line boil on threes)
const boil = (t, n = 3) => Math.floor(t * FPS / n) % 3;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const ease = { inOut: (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
               out: (x) => 1 - Math.pow(1 - x, 3), in: (x) => x * x * x };
// key(t, [[t0,v0],[t1,v1],...], easing): pose-to-pose interpolation with holds between keys
function key(t, keys, e = ease.inOut) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [ta, va] = keys[i], [tb, vb] = keys[i + 1];
    if (t <= tb) return lerp(va, vb, e(clamp((t - ta) / (tb - ta))));
  }
  return keys[keys.length - 1][1];
}

// ---- assets (painted plates, cels) embedded as data URIs --------------------
const ASSETS = { /* name: 'data:image/webp;base64,...' */ };
const IMG = {};
const ready = Promise.all(Object.entries(ASSETS).map(([k, src]) => new Promise((res, rej) => {
  const im = new Image(); im.onload = () => { IMG[k] = im; res(); }; im.onerror = rej; im.src = src;
}))).then(() => document.fonts ? document.fonts.ready : null);

// ---- shots: [start, end, drawFn(localT, shotT01)] ---------------------------
const SHOTS = [
  [0, DURATION, (lt, k) => { g.fillStyle = '#223'; g.fillRect(0, 0, W, H); }],
];

function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  for (const [a, b, fn] of SHOTS) if (t >= a && t < b) { g.save(); fn(t - a, (t - a) / (b - a)); g.restore(); break; }
}

// ---- subtitles: the same cues feed the overlay and the exported .vtt ---------
const SUBTITLES = {
  fr: [ /* [start, end, "texte"] */ ],
  en: [ ],
};
let lang = 'fr';
function showSub(t) {
  const el = document.getElementById('sub');
  const cue = lang === 'off' ? null : (SUBTITLES[lang] || []).find(([a, b]) => t >= a && t < b);
  el.textContent = cue ? cue[2] : '';
}

// ---- sound: built once in an OfflineAudioContext, played back live ----------
// buildAudio(ctx, from, to) schedules everything on ctx; the same code makes the
// render WAV and the live playback, so picture and sound always match.
function buildAudio(ctx, from, to) {
  // example: const o = ctx.createOscillator(); ... schedule at (cueTime - from)
}
async function renderAudio(from = 0, to = DURATION, rate = 48000) {
  const ctx = new OfflineAudioContext(2, Math.ceil((to - from) * rate), rate);
  buildAudio(ctx, from, to);
  return ctx.startRendering();
}
function wav(buf) {
  const n = buf.length, ch = buf.numberOfChannels, out = new ArrayBuffer(44 + n * ch * 2), v = new DataView(out);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, ch, true); v.setUint32(24, buf.sampleRate, true);
  v.setUint32(28, buf.sampleRate * ch * 2, true); v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * ch * 2, true);
  const data = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  for (let i = 0, o = 44; i < n; i++) for (let c = 0; c < ch; c++, o += 2) v.setInt16(o, Math.max(-1, Math.min(1, data[c][i])) * 0x7fff, true);
  return out;
}

window.FILM = {
  duration: DURATION, fps: FPS, width: W, height: H, ready, subtitles: SUBTITLES,
  seek: async (t) => { draw(Math.max(0, Math.min(DURATION - 1e-6, t))); },
  audio: async (from = 0, to = DURATION) => wav(await renderAudio(from, to)),
};

// ---- live playback (not used by the renderer) -------------------------------
if (!RENDER) {
  let actx, src, startAt = 0, playing = false;
  const startUI = document.getElementById('start'), endUI = document.getElementById('end');
  document.querySelectorAll('.langs button').forEach((b) => b.onclick = (e) => {
    e.stopPropagation(); lang = b.dataset.l;
    document.querySelectorAll('.langs button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  });
  async function play() {
    startUI.classList.add('hidden'); endUI.classList.add('hidden');
    await ready;
    actx = actx || new AudioContext();
    const buf = await renderAudio();
    src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
    startAt = actx.currentTime + 0.05; src.start(startAt); playing = true;
    requestAnimationFrame(loop);
  }
  function loop() {
    if (!playing) return;
    const t = actx.currentTime - startAt;                  // audio clock is the master clock
    if (t >= DURATION) { playing = false; draw(DURATION - 1e-6); showSub(-1); endUI.classList.remove('hidden'); return; }
    const ts = Math.max(0, t);
    draw(ts); showSub(ts);
    requestAnimationFrame(loop);
  }
  document.getElementById('play').onclick = play;
  startUI.onclick = (e) => { if (e.target === startUI) play(); };
  document.getElementById('replay').onclick = play;
  ready.then(() => draw(0));
}
</script>
</body>
</html>
